version: '3.8'

services:
  # メインサービス（基本設定）
  xvee:
    build:
      context: .
      dockerfile: Dockerfile
    image: xvee:latest
    container_name: xvee
    
    # ボリュームマッピング
    volumes:
      - ./input:/app/input:rw
      - ./output:/app/output:rw
      - ./sample.mp4:/app/sample.mp4:ro
    
    # 環境変数
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tokyo
      - FORCE_CPU_MODE=1  # GPU無効化でメモリ使用量を削減
    
    # リソース制限（大量ファイル処理用に調整）
    deploy:
      resources:
        limits:
          memory: 4G  # メモリを増加
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    
    restart: unless-stopped
    profiles: ["manual"]

  # 小さなバッチ処理（推奨）
  xvee-small-batch:
    build:
      context: .
      dockerfile: Dockerfile
    image: xvee:latest
    container_name: xvee-small-batch
    profiles: ["small-batch"]
    volumes:
      - ./input:/app/input:rw
      - ./output:/app/output:rw
      - ./sample.mp4:/app/sample.mp4:ro
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tokyo
      - FORCE_CPU_MODE=1
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    restart: unless-stopped
    entrypoint: ["python", "exif_enchanter.py"]
    command: [
      "--batch", "/app/input",
      "--batch-size", "20",
      "--disable-parallel",
      "--debug"
    ]

  # 中サイズバッチ処理
  xvee-medium-batch:
    extends: xvee
    container_name: xvee-medium-batch
    profiles: ["medium-batch"]
    entrypoint: ["python", "exif_enchanter.py"]
    command: [
      "--batch", "/app/input",
      "--batch-size", "50",
      "--disable-parallel",
      "--debug"
    ]

  # 大サイズバッチ処理（注意：長時間実行）
  xvee-large-batch:
    extends: xvee
    container_name: xvee-large-batch
    profiles: ["large-batch"]
    entrypoint: ["python", "exif_enchanter.py"]
    deploy:
      resources:
        limits:
          memory: 6G  # さらにメモリを増加
          cpus: '3.0'
    command: [
      "--batch", "/app/input",
      "--batch-size", "100",
      "--disable-parallel",
      "--debug"
    ]

  # 単一ファイル処理
  xvee-single:
    extends: xvee
    container_name: xvee-single
    profiles: ["single"]
    command: [
      "/app/input/VIDEO_1750580208742.mp4",
      "--output", "/app/output/test_single.mp4",
      "--debug"
    ]

  # カスタム場所付きバッチ処理
  xvee-batch-location:
    extends: xvee
    container_name: xvee-batch-location
    profiles: ["batch-location"]
    entrypoint: ["python", "exif_enchanter.py"]
    command: [
      "--batch", "/app/input",
      "--batch-size", "30",
      "--disable-parallel",
      "--location", "リビング",
      "--debug"
    ]

  # 継続処理（失敗ファイルをスキップして続行）
  xvee-batch-continue:
    extends: xvee
    container_name: xvee-batch-continue
    profiles: ["continue"]
    entrypoint: ["python", "exif_enchanter.py"]
    command: [
      "--batch", "/app/input",
      "--batch-size", "25",
      "--disable-parallel",
      "--debug"
    ]

  # 繰り返し処理用のベースサービス
  xvee-repeat-base:
    extends: xvee
    profiles: ["never"]  # 直接実行されないようにする
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    volumes:
      - ./input:/app/input:rw
      - ./output:/app/output:rw
      - ./.batch_progress:/app/.batch_progress:rw
      - ./.processed_files:/app/.processed_files:rw

  # 小サイズ繰り返し処理（最も安全）
  xvee-repeat-small:
    extends: xvee-repeat-base
    container_name: xvee-repeat-small
    profiles: ["repeat-small"]
    environment:
      - BATCH_SIZE=20
      - MAX_ITERATIONS=200
    
  # 中サイズ繰り返し処理
  xvee-repeat-medium:
    extends: xvee-repeat-base
    container_name: xvee-repeat-medium
    profiles: ["repeat-medium"]
    environment:
      - BATCH_SIZE=50
      - MAX_ITERATIONS=100

  # 大サイズ繰り返し処理
  xvee-repeat-large:
    extends: xvee-repeat-base
    container_name: xvee-repeat-large
    profiles: ["repeat-large"]
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '3.0'
    environment:
      - BATCH_SIZE=100
      - MAX_ITERATIONS=50

networks:
  xvee-network:
    driver: bridge